# Sestaví Android APK při každém pushnutí do main/master a zveřejní ho na stránce Releases.
# První build trvá ~40–60 min (stahuje se Android SDK/NDK), další díky cache ~10–20 min.
name: Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - python: "3.11"        # PC verze
            pygame: "pygame-ce"
          - python: "3.10"        # stejná verze pygame jako v Android APK
            pygame: "pygame==2.1.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Závislosti
        run: pip install "${{ matrix.pygame }}" "numpy<2"
      - name: Smoke testy (headless)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python tests/smoke_test.py fast

  android:
    needs: tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Systémové balíčky
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential

      - name: Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install "buildozer==1.5.0" "cython==0.29.36" "setuptools<70"

      - name: Cache Android SDK/NDK a buildů
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-v2-${{ runner.os }}-

      - name: Verze a podpisový klíč
        run: |
          sed -i "s/^version = .*/version = 1.0.${{ github.run_number }}/" buildozer.spec
          sed -i "s/^VERSION = .*/VERSION = \"1.0.${{ github.run_number }}\"/" game/config.py
          grep -n "^VERSION" game/config.py
          sed -i "/^version = /a android.numeric_version = ${{ github.run_number }}" buildozer.spec
          grep -n "version" buildozer.spec
          # stálý klíč → nové verze jdou nainstalovat přes staré bez ztráty uložené hry
          mkdir -p ~/.android
          cp app_assets/debug.keystore ~/.android/debug.keystore

      - name: Sestavit APK
        run: |
          set -o pipefail
          buildozer android debug < /dev/null 2>&1 | tee build.log

      - name: Uložit log chyby do větve build-log (diagnostika)
        if: failure()
        run: |
          tail -n 600 build.log > build-tail.log 2>/dev/null || echo "build.log chybí" > build-tail.log
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan build-log
          git rm -rf --cached . > /dev/null
          git add -f build-tail.log
          git commit -m "Log neúspěšného buildu ${{ github.run_number }}"
          git push -f origin build-log

      - name: Přejmenovat APK
        run: |
          mkdir -p dist
          cp bin/*.apk dist/LastChicken.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: LastChicken-apk
          path: dist/LastChicken.apk

      - name: Vydat na stránce Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Last Chicken 1.0.${{ github.run_number }}
          make_latest: true
          files: dist/LastChicken.apk
          body: |
            **Instalace na Android:** na telefonu otevři tuto stránku, klepni na `LastChicken.apk`,
            po stažení ho otevři a povol instalaci z tohoto zdroje (prohlížeč / Soubory).
            Novější verze se instaluje přes starou – uložená hra zůstane.
